# ═══════════════════════════════════════════════════════════════
# PS2 Hub — Configuração do aria2c para gerenciamento de downloads
# ═══════════════════════════════════════════════════════════════

# ── RPC (comunicação com o PS2 Hub) ─────────────────────────────
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-secret=ps2hub
rpc-allow-origin-all=true

# ── Diretório de downloads ──────────────────────────────────────
dir=./data/downloads

# ── Performance ─────────────────────────────────────────────────
max-concurrent-downloads=3
max-connection-per-server=16
split=16
min-split-size=1M
continue=true
max-tries=5
retry-wait=5
timeout=600

# ── Alocação de disco ──────────────────────────────────────────
file-allocation=falloc
disk-cache=64M

# ── Logging ─────────────────────────────────────────────────────
log-level=warn
console-log-level=notice

# ── Sessão (retoma downloads ao reiniciar) ──────────────────────
input-file=./data/downloads/aria2.session
save-session=./data/downloads/aria2.session
save-session-interval=30

# ── Daemon ──────────────────────────────────────────────────────
daemon=true
