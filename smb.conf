# ═══════════════════════════════════════════════════════════════
# PS2 Hub — Samba Configuration for OPL (Open PS2 Loader)
# ═══════════════════════════════════════════════════════════════
# OPL requires SMBv1 with specific settings to function correctly.
# This config shares the PS2 data folder without authentication.
# ═══════════════════════════════════════════════════════════════

[global]
   workgroup = PS2
   server string = PS2 Hub Samba Server
   server role = standalone server

   # ── Segurança (acesso sem senha para o PS2) ──────────────────
   security = user
   map to guest = Bad User
   guest account = nobody

   # ── SMBv1 obrigatório para OPL ───────────────────────────────
   server min protocol = NT1
   server max protocol = NT1
   ntlm auth = yes

   # ── Performance para jogos ───────────────────────────────────
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536
   read raw = yes
   write raw = yes
   use sendfile = yes
   aio read size = 16384
   aio write size = 16384
   min receivefile size = 16384

   # ── Logging ──────────────────────────────────────────────────
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

   # ── Desabilitar impressoras ──────────────────────────────────
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

# ── Compartilhamento PS2 ────────────────────────────────────────
[PS2HUB]
   comment = PS2 Games (OPL)
   path = /home/doardin/projects/ps2-hub/data
   browseable = yes
   public = yes
   guest ok = yes
   read only = no
   writable = yes
   create mask = 0777
   directory mask = 0777
   force user = doardin
   force group = doardin
